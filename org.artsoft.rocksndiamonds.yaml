app-id: org.artsoft.rocksndiamonds
runtime: org.freedesktop.Platform
runtime-version: 25.08
sdk: org.freedesktop.Sdk
command: rocksndiamonds
finish-args:
  - --socket=x11
  - --share=ipc
  - --share=network
  - --device=dri
  - --socket=pulseaudio
  
build-options:
  env:
    C_INCLUDE_PATH: /app/include/SDL2:/app/include
    CPLUS_INCLUDE_PATH: /app/include/SDL2:/app/include

modules:
  - shared-modules/SDL2/SDL2_image.json
  - name: libxmp #SDL2-mixer
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DBUILD_STATIC=OFF
      - -DCMAKE_BUILD_TYPE:STRING=Release
    sources:
      - type: archive
        url: https://github.com/libxmp/libxmp/releases/download/libxmp-4.6.3/libxmp-4.6.3.tar.gz
        sha256: b189a2ff3f3eef0008512e0fb27c2cdc27480bc1066b82590a84d02548fab96d
  - name: fluidsynth #SDL2-mixer
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://github.com/FluidSynth/fluidsynth/archive/refs/tags/v2.4.8.tar.gz
        sha256: d6d04e9014557906ee42aa1fe3cd580840ea482d4c3b1a45fddd45ec606d6e97
  - name: SDL2-mixer
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_VERBOSE_MAKEFILE=ON
      - -DCMAKE_BUILD_TYPE:STRING=Release
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL_mixer/releases/download/release-2.8.1/SDL2_mixer-2.8.1.tar.gz
        sha256: cb760211b056bfe44f4a1e180cc7cb201137e4d1572f2002cc1be728efd22660
  - name: SDL2-net
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_VERBOSE_MAKEFILE=ON
      - -DCMAKE_BUILD_TYPE:STRING=Release
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL_net/releases/download/release-2.2.0/SDL2_net-2.2.0.tar.gz
        sha256: 4e4a891988316271974ff4e9585ed1ef729a123d22c08bd473129179dc857feb
  - name: rocksndiamonds
    buildsystem: simple
    build-commands:
      - make BASE_PATH=${FLATPAK_DEST}/share/rocksndiamonds
    post-install:
      - install -Dm 755 rocksndiamonds ${FLATPAK_DEST}/bin/rocksndiamonds
      - mkdir -p ${FLATPAK_DEST}/share/rocksndiamonds
      - cp -a graphics levels music sounds ${FLATPAK_DEST}/share/rocksndiamonds
      - install -Dm 644 rocksndiamonds.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png
      - install -Dm 644 rocksndiamonds.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm 644 rocksndiamonds.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
    sources:
      - type: archive
        url: https://www.artsoft.org/RELEASES/linux/rocksndiamonds/rocksndiamonds-4.4.0.6-linux.tar.gz
        sha256: 6c8b780f3f7544e87f3f09710dfc5ec9d1de8eca600bbae6f2fec3ce1f14865d
      - type: shell
        commands:
          - rm rocksndiamonds
          - rm -rf lib
      - type: file
        path: rocksndiamonds.desktop
      - type: file
        path: rocksndiamonds.metainfo.xml
      - type: file
        path: rocksndiamonds.png
